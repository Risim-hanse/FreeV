[project]
name = "freev"
version = "0.1.0"
description = "Free Lunch For Vocoders Through Pseudo Inversed Mel Filter"
readme = "README.md"
requires-python = ">=3.9,<3.14"
dependencies = [
    "einops>=0.7.0",
    "librosa>=0.10.2",
    "matplotlib>=3.7.0",
    "numpy>=1.23.5",
    "pghipy>=0.0.1",
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
    "tensorboard>=2.14.0",
    "torch>=2.6.0,<3",
    "torchaudio>=2.6.0,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.uv]
default-groups = ["dev"]